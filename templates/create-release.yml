# Installed into product repos as .github/workflows/create-release.yml by release-tooling's Manage repo workflow.
# Runs only when the repo variable RELEASE_TOOLING_MODE is warn or enforce.
# It adds a "Run workflow" button under Actions → Create release.
name: Create release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [minor, major, patch]
        default: minor
      patch_of:
        description: Only for patch. The release to patch, e.g. v2.16.0
        type: string
        default: ''
      proceed_with_unmerged:
        description: Proceed with unmerged releases
        type: boolean
        default: false

jobs:
  create:
    if: contains(fromJSON('["warn","enforce"]'), vars.RELEASE_TOOLING_MODE)
    uses: HeyReach/release-tooling/.github/workflows/create-release.yml@v1
    with:
      bump: ${{ inputs.bump }}
      patch_of: ${{ inputs.patch_of }}
      proceed_with_unmerged: ${{ inputs.proceed_with_unmerged }}
      # allowed_team: release-managers   # uncomment once the team exists
    secrets: inherit
