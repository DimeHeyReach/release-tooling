# Installed into product repos as .github/workflows/cleanup-releases.yml by release-tooling's Manage repo workflow.
# Runs only when the repo variable RELEASE_TOOLING_MODE is warn or enforce.
# Runs every night; can also be run by hand as a dry run.
name: Clean up releases

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would be deleted
        type: boolean
        default: true

jobs:
  cleanup:
    if: contains(fromJSON('["warn","enforce"]'), vars.RELEASE_TOOLING_MODE)
    uses: HeyReach/release-tooling/.github/workflows/cleanup-releases.yml@v1
    with:
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
