# Shared automations that run without anyone clicking:
#  - pull_request closed into release/**: delete the rc/hotfix branch, pull
#    master in, open the release → master PR with auto-merge
#  - push to master: pull master into every open release
#  - always afterwards (and on any push to release/**): recalculate the
#    release-ready status of every open release
# Product repos call it from templates/release-automation.yml.
name: Release automation

on:
  workflow_call:
    inputs:
      main_branch:
        type: string
        default: master
      tooling_ref:
        description: Version of release-tooling to run. Keep it the same as the @ref in `uses:`
        type: string
        default: v1
    secrets:
      RELEASE_BOT_APP_ID:
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        required: true

# Never let two automations change release branches at the same time.
concurrency:
  group: release-tooling-sync-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Release automation
    runs-on: ubuntu-latest
    steps:
      - name: Get a release bot token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},release-tooling

      - name: Bot identity for merge commits
        id: bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Check out the repo (all branches and tags)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          path: repo

      - name: Check out release-tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/release-tooling
          ref: ${{ inputs.tooling_ref }}
          token: ${{ steps.token.outputs.token }}
          path: .release-tooling

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: RC or hotfix merged into a release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO_DIR: repo
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          MAIN_BRANCH: ${{ inputs.main_branch }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: node .release-tooling/src/cli.mjs on-release-merge

      - name: Pull master into open releases
        if: github.event_name == 'push' && github.ref_name == inputs.main_branch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO_DIR: repo
          MAIN_BRANCH: ${{ inputs.main_branch }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: node .release-tooling/src/cli.mjs sync-releases

      - name: Update release-ready
        if: always() && steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO_DIR: repo
          MAIN_BRANCH: ${{ inputs.main_branch }}
        run: node .release-tooling/src/cli.mjs readiness
