# Shared "Scrap release" workflow. Product repos call it from templates/scrap-release.yml.
name: Scrap release

on:
  workflow_call:
    inputs:
      version:
        description: The release to scrap, e.g. v2.16.0
        type: string
        required: true
      allowed_team:
        description: GitHub team slug allowed to run this. Empty = anyone with write access
        type: string
        default: ''
      main_branch:
        type: string
        default: master
      tooling_ref:
        description: Version of release-tooling to run. Keep it the same as the @ref in `uses:`
        type: string
        default: v1
    secrets:
      RELEASE_BOT_APP_ID:
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        required: true

# Shares the lock with the release automation: never change release branches at the same time.
concurrency:
  group: release-tooling-sync-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrap:
    name: Scrap release
    runs-on: ubuntu-latest
    steps:
      - name: Get a release bot token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},release-tooling

      - name: Check permission
        if: inputs.allowed_team != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TEAM: ${{ inputs.allowed_team }}
        run: |
          state=$(gh api "orgs/${{ github.repository_owner }}/teams/$TEAM/memberships/${{ github.actor }}" --jq .state 2>/dev/null || true)
          if [ "$state" != "active" ]; then
            echo "## ⛔ ${{ github.actor }} is not in the $TEAM team, so they can't do this." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check out the repo (all branches and tags)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          path: repo

      - name: Check out release-tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/release-tooling
          ref: ${{ inputs.tooling_ref }}
          token: ${{ steps.token.outputs.token }}
          path: .release-tooling

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrap
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO_DIR: repo
          VERSION: ${{ inputs.version }}
          MAIN_BRANCH: ${{ inputs.main_branch }}
        run: node .release-tooling/src/cli.mjs scrap

      - name: Update release-ready (a scrap can unblock higher releases)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO_DIR: repo
          MAIN_BRANCH: ${{ inputs.main_branch }}
        run: node .release-tooling/src/cli.mjs readiness
